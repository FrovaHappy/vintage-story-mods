name: Build and Release

on:
  workflow_dispatch:
    inputs:
      seraphui:
        description: 'Versión a publicar para Seraph UI (seraphui)'
        required: true
        type: choice
        options:
          - none
          - major
          - minor
          - fix
          - dev
        default: 'none'
      tradersoverhaul:
        description: 'Versión a publicar para Traders Overhaul (tradersoverhaul)'
        required: true
        type: choice
        options:
          - none
          - major
          - minor
          - fix
          - dev
        default: 'none'
      seraphqol:
        description: 'Versión a publicar para Seraph QoL (seraphqol)'
        required: true
        type: choice
        options:
          - none
          - major
          - minor
          - fix
          - dev
        default: 'none'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build & Release Selected Mods
    runs-on: ubuntu-latest
    environment: release
    env:
      VS_VERSION: '1.22.0'
      VINTAGE_STORY: ${{ github.workspace }}/.vs-sdk/1.22.0

    steps:
      - name: Validate selected mods
        id: select
        run: |
          SELECTED=()
          if [ "${{ github.event.inputs.seraphui }}" != "none" ]; then
            SELECTED+=("seraphui")
          fi
          if [ "${{ github.event.inputs.tradersoverhaul }}" != "none" ]; then
            SELECTED+=("tradersoverhaul")
          fi
          if [ "${{ github.event.inputs.seraphqol }}" != "none" ]; then
            SELECTED+=("seraphqol")
          fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "Error: debes seleccionar una versión distinta de 'none' en al menos un mod." >&2
            exit 1
          fi

          MODS_CSV=$(IFS=,; echo "${SELECTED[*]}")
          echo "Selected mods: $MODS_CSV"
          echo "mods=$MODS_CSV" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Vintage Story reference assemblies
        id: vs-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VINTAGE_STORY }}
          key: vs-sdk-linux-${{ env.VS_VERSION }}-v1

      - name: Download Vintage Story SDK from official CDN
        if: steps.vs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          API_JSON=$(curl -fsSL "https://api.vintagestory.at/stable.json")
          CLIENT_URL=$(echo "$API_JSON" | jq -r --arg ver "$VS_VERSION" '.[$ver].linux.urls.cdn // empty')
          if [ -z "$CLIENT_URL" ]; then
            CLIENT_URL="https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_${VS_VERSION}.tar.gz"
          fi

          echo "Downloading Vintage Story ${VS_VERSION} from: ${CLIENT_URL}"
          curl -fsSL "$CLIENT_URL" -o /tmp/vs_client.tar.gz

          mkdir -p /tmp/vs_extract "$VINTAGE_STORY"
          tar -xzf /tmp/vs_client.tar.gz -C /tmp/vs_extract --wildcards '*.dll' '*/Mods/*.dll' '*/Lib/*.dll' 'Mods/*.dll' 'Lib/*.dll' || \
            tar -xzf /tmp/vs_client.tar.gz -C /tmp/vs_extract

          API_DLL=$(find /tmp/vs_extract -name 'VintagestoryAPI.dll' -print -quit)
          if [ -z "$API_DLL" ]; then
            echo "Error: VintagestoryAPI.dll not found in downloaded archive." >&2
            exit 1
          fi

          API_DIR=$(dirname "$API_DLL")
          mkdir -p "$VINTAGE_STORY/Mods" "$VINTAGE_STORY/Lib"
          cp -f "$API_DIR"/*.dll "$VINTAGE_STORY/"
          cp -f "$API_DIR"/Mods/*.dll "$VINTAGE_STORY/Mods/"
          cp -f "$API_DIR"/Lib/*.dll "$VINTAGE_STORY/Lib/"

          rm -rf /tmp/vs_client.tar.gz /tmp/vs_extract
          test -f "$VINTAGE_STORY/VintagestoryAPI.dll"
          test -f "$VINTAGE_STORY/Lib/cairo-sharp.dll"

      - name: Run release script tests
        run: node --test scripts/bump-mods.test.mjs

      - name: Run unit tests
        run: dotnet test VintageStoryMods.sln -c Release -m:1 -p:VintageStoryDir="$VINTAGE_STORY"

      - name: Bump mod versions, update changelogs, commit and tag
        id: release
        run: |
          set -euo pipefail
          MANIFEST="/tmp/release-manifest.json"
          node scripts/bump-mods.mjs \
            --mod "seraphui=${{ github.event.inputs.seraphui }}" \
            --mod "tradersoverhaul=${{ github.event.inputs.tradersoverhaul }}" \
            --mod "seraphqol=${{ github.event.inputs.seraphqol }}" \
            --manifest "$MANIFEST"

          mapfile -t CHANGED_FILES < <(jq -r '.changedFiles[]' "$MANIFEST")
          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "Error: no files changed during version bump." >&2
            exit 1
          fi

          git add -- "${CHANGED_FILES[@]}"
          COMMIT_MSG=$(jq -r '.commitMessage' "$MANIFEST")
          git commit -m "$COMMIT_MSG"

          TAGS=()
          while IFS= read -r TAG; do
            git tag -a "$TAG" -m "chore(release): $TAG"
            TAGS+=("$TAG")
          done < <(jq -r '.releases[].tag' "$MANIFEST")

          echo "tags=${TAGS[*]}" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Build and package selected mods
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-mods.ps1 \
            -BuildOnly \
            -Mods "${{ steps.select.outputs.mods }}"

      - name: Collect release assets and checksums
        run: |
          set -euo pipefail
          MANIFEST="${{ steps.release.outputs.manifest }}"
          while IFS=$'\t' read -r MOD_ID ZIP_NAME; do
            mkdir -p "release-assets/${MOD_ID}"
            cp "dist/${ZIP_NAME}" "release-assets/${MOD_ID}/${ZIP_NAME}"
            (
              cd "release-assets/${MOD_ID}"
              sha256sum "${ZIP_NAME}" > SHA256SUMS.txt
            )
          done < <(jq -r '.releases[] | [.modId, .zipName] | @tsv' "$MANIFEST")

      - name: Push commit and tags
        run: git push origin HEAD ${{ steps.release.outputs.tags }}

      - name: Create GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MANIFEST="${{ steps.release.outputs.manifest }}"
          while IFS=$'\t' read -r MOD_ID TAG ZIP_NAME RELEASE_IS_DEV NOTES_FILE; do
            EXTRA_ARGS=()
            if [ "$RELEASE_IS_DEV" = "true" ]; then
              EXTRA_ARGS+=("--prerelease")
            fi

            NOTES_ARGS=("--generate-notes")
            if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
              NOTES_ARGS=("--notes-file" "$NOTES_FILE")
            fi

            gh release create "$TAG" \
              "release-assets/${MOD_ID}/${ZIP_NAME}" \
              "release-assets/${MOD_ID}/SHA256SUMS.txt" \
              "${EXTRA_ARGS[@]}" \
              --title "$TAG" \
              "${NOTES_ARGS[@]}"
          done < <(jq -r '.releases[] | [.modId, .tag, .zipName, (.isDev | tostring), (.notesFile // "")] | @tsv' "$MANIFEST")
